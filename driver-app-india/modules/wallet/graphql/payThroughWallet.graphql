mutation payForOrderViaWallet(
  $amount: numeric!
  $order_id: uuid!
  $wallet_id: uuid!
) {
  payThroughWallet(
    object: {amount: $amount, order_id: $order_id, wallet_id: $wallet_id}
  ) {
    order_id
    payment_id
    status
  }
}

