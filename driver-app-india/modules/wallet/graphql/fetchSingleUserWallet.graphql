query fetchSingleUserWallet($organization_user_id: uuid!) {
  checkWalletBalance(object: {organization_user_id: $organization_user_id}) {
    amount
    van_code
    van_number
    available_balance
    is_credit_available
    block_amount
    is_amount_available
    organization_user_id
    wallet_id
    currency_id
    allowed_credit_limit
    total_overdue_amount
  }
}
