query fetchAllOrgUsersByType(
  $limit: Int
  $offset: Int
  $organization_user_type: String
) {
  organization_user(
    limit: $limit
    offset: $offset
    where: {
      is_active: {_eq: true}
      organization_user_type: {_eq: $organization_user_type}
    }
    order_by: {created_at: desc}
  ) {
    created_at
    organization_user_type
    role_id
    role {
      role
      id
    }
    id
    is_owner
    organization_id
    organization {
      is_credit_available
      organization_segmentation {
        name
        id
      }
      is_business
      cin_number
      brand
      brand_logo
      name
      is_post_paid
      is_active
      id
      default_currency
      pan_number
      description
      gst_number
      holding_company
      signed_invoice_on_email
      technical_contact_email
      technical_contact_full_name
      technical_contact_phone_number
      is_otp_required_placed_order
    }
    user_id
    user {
      email
      middle_name
      last_name
      pan_number
      phone_number
      first_name
      is_active
      customer_segmentation {
        id
        name
      }
    }
  }
  organization_user_aggregate(where: {is_active: {_eq: true}}) {
    aggregate {
      count
    }
  }
}
