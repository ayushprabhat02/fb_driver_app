query fetchDriverVehicleId($dateTime: timestamp) {
  shift_schedule(
    where: {end_time: {_gte: $dateTime}, start_time: {_lte: $dateTime}}
    limit: 1
    offset: 0
  ) {
    driver_vehicle_id
    end_time
    id
    start_time
    driver_vehicle {
      driver_id
      id
      status
      state
    }
  }
}
